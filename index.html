<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cavel SMP - Official Web Client</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000; font-family: sans-serif;
        }
        iframe {
            width: 100%; height: 100%; border: none;
        }
        #setup-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(20, 20, 20, 0.95); color: #fff;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; z-index: 9999; text-align: center;
        }
        .btn {
            background: #5b8731; color: white; border: none; padding: 15px 30px;
            font-size: 18px; font-weight: bold; cursor: pointer; border-radius: 4px;
            margin-top: 20px; box-shadow: 0 4px #3b5c1d;
        }
        .btn:active {
            transform: translateY(4px); box-shadow: none;
        }
        h1 { margin-bottom: 5px; color: #fdb813; }
        p { color: #aaa; max-width: 400px; line-height: 1.5; }
    </style>
</head>
<body>

    <div id="setup-overlay">
        <h1>⛰️ Cavel SMP Launcher ⛰️</h1>
        <p>This customized client connects directly to <b>cavelsmp.play.hosting</b> via the Wisp Network relay configuration.</p>
        <button class="btn" onclick="launchGame()">LAUNCH PLAY.HOSTING CONNECT</button>
    </div>

    <!-- This loads a modern WebAssembly Eaglercraft hub embedded with your custom crossplay server target -->
    <iframe id="game-frame" src=""></iframe>

    <script>
        function launchGame() {
            // Target elements
            const overlay = document.getElementById('setup-overlay');
            const frame = document.getElementById('game-frame');
            
            // Build the URL parameter payload pointing to your exact play.hosting network allocation
            const serverName = encodeURIComponent("Cavel SMP");
            const serverAddr = "ws://62.141.62.28:9132"; 
            const relayUrl = "wss://wisp.webmc.fun";
            
            // Generate the auto-inject link using an active, unblocked WASM network instance
            const launchUrl = `https://eaglercraft.com{serverAddr}&name=${serverName}&relay=${relayUrl}`;
            
            // Hide the instructions, load the game loop frame
            overlay.style.display = 'none';
            frame.src = launchUrl;
        }
    </script>
</body>
</html>
