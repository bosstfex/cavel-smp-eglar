<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cavel SMP - Modern Client Portal</title>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none; -webkit-user-select: none;
        }
        #app-container {
            width: 100%; height: 100%; position: relative;
        }
        iframe {
            width: 100%; height: 100%; border: none;
            position: absolute; top: 0; left: 0; z-index: 1;
        }
        #loading-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #1a1a1a 0%, #0a0a0a 100%);
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; z-index: 10; color: #fff;
            transition: opacity 0.5s ease-out;
        }
        .spinner {
            width: 50px; height: 50px;
            border: 5px solid rgba(91, 135, 49, 0.2);
            border-top: 5px solid #5b8731;
            border-radius: 50%; animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h1 {
            color: #5b8731; font-size: 32px; margin: 0 0 10px 0;
            text-transform: uppercase; letter-spacing: 3px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }
        p {
            color: #888; font-size: 14px; margin: 0;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div id="app-container">
        <!-- Animated loading layout screen -->
        <div id="loading-screen">
            <div class="spinner"></div>
            <h1>⛰️ Cavel SMP ⛰️</h1>
            <p>Initializing Modern Network Protocols...</p>
        </div>

        <!-- Replaced the dead Vercel site with an active community modern client embed -->
        <iframe 
            id="game-engine"
            src="https://github.io" 
            allow="autoplay; gamepad; fullscreen; keyboard"
            onload="hideLoading()">
        </iframe>
    </div>

    <script>
        function hideLoading() {
            const loader = document.getElementById('loading-screen');
            setTimeout(() => {
                loader.style.opacity = '0';
                setTimeout(() => {
                    loader.style.display = 'none';
                }, 500);
            }, 1000);
        }
    </script>

</body>
</html>
