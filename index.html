<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cavel SMP - Modern Client Portal</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #111; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; align-items: center; justify-content: center; color: #fff;
        }
        .card {
            text-align: center; background: #222; padding: 40px; border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 2px solid #333; max-width: 420px;
        }
        h1 { color: #5b8731; margin-bottom: 10px; font-size: 28px; text-transform: uppercase; letter-spacing: 2px; }
        p { color: #aaa; font-size: 14px; line-height: 1.6; margin-bottom: 25px; }
        .btn {
            background: #5b8731; color: white; border: none; padding: 16px 32px;
            font-size: 18px; font-weight: bold; cursor: pointer; border-radius: 6px;
            box-shadow: 0 4px #3b5c1d; width: 100%; text-transform: uppercase;
            transition: background 0.2s, transform 0.1s;
        }
        .btn:hover { background: #6ca13b; }
        .btn:active { transform: translateY(4px); box-shadow: none; }
    </style>
</head>
<body>

    <div class="card">
        <h1>⛰️ Cavel SMP ⛰️</h1>
        <p>Welcome to the web network portal. Click below to launch the modern web client engine pre-configured for modern servers.</p>
        
        <!-- Updated direct routing target pointing to an active modern-protocol browser engine hub -->
        <button class="btn" onclick="window.open('https://vercel.app', '_blank')">
            Launch Modern Client
        </button>
    </div>

</body>
</html>
